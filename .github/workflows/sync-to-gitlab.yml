name: Sync protected branches to GitLab

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-swc:
    name: Sync to SWC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch protected branches
        id: refs
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/develop:refs/remotes/origin/develop +refs/heads/main:refs/remotes/origin/main

      - name: Prepare GitLab repository settings
        id: gitlab-repo
        uses: ./.github/actions/prepare-gitlab-repo
        with:
          gitlab-repo: ${{ secrets.GITLAB_REPO }}

      - name: Push protected branches and tags to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO_HOST_PATH: ${{ steps.gitlab-repo.outputs.host-path }}
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_TOKEN}" ] || [ -z "${GITLAB_REPO_HOST_PATH}" ]; then
            echo "GITLAB_TOKEN and GITLAB_REPO secrets are required."
            exit 1
          fi
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO_HOST_PATH}"
          git push -o ci.skip gitlab \
            refs/remotes/origin/develop:refs/heads/develop \
            refs/remotes/origin/main:refs/heads/main --force
          git push -o ci.skip gitlab --tags --force

  sync-gitlab-com:
    name: Sync to GitLab.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch protected branches
        id: refs
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/develop:refs/remotes/origin/develop +refs/heads/main:refs/remotes/origin/main

      - name: Push protected branches and tags to GitLab.com
        env:
          GITLAB_COM_DEPLOY_KEY: ${{ secrets.GITLAB_COM_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$GITLAB_COM_DEPLOY_KEY" ]; then
            echo "GITLAB_COM_DEPLOY_KEY is required for GitLab.com synchronization."
            exit 1
          fi

          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$GITLAB_COM_DEPLOY_KEY" > "$ssh_dir/deploy_key"
          unset GITLAB_COM_DEPLOY_KEY

          # GitLab.com publishes this ED25519 host key in its instance documentation.
          printf '%s\n' 'gitlab.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAfuCHKVTjquxvt6CM6tdG4SLp1Btn/nOeHHE5UOzRdf' > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -F /dev/null -i '$ssh_dir/deploy_key' -o IdentityAgent=none -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile='$ssh_dir/known_hosts'"
          git remote add gitlab-com git@gitlab.com:cx-benchmarks/benchkit.git
          git push -o ci.skip gitlab-com \
            refs/remotes/origin/develop:refs/heads/develop \
            refs/remotes/origin/main:refs/heads/main
          git push -o ci.skip gitlab-com --tags
