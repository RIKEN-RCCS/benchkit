name: Result Server Tests

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: result-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-scope:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test CI scope selection
        run: python3 -m unittest discover -s scripts/tests -p test_ci_test_scope.py
      - name: Select test scope
        id: scope
        run: python3 scripts/tests/ci_test_scope.py

  pytest:
    needs: test-scope
    if: needs.test-scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
        python-version:
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements-result-server.txt

      - name: Install result_server test dependencies
        run: |
          python -m pip install -r requirements-result-server.txt

      - name: Run site configuration preflight
        run: python result_server/tests/check_site_config.py

      - name: Run result_server pytest suite
        run: python result_server/tests/run_result_server_tests.py --shard ${{ matrix.shard }} -q -n 2 --dist loadfile --durations=10

  encrypted-budget-db:
    needs: test-scope
    if: needs.test-scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        shard: [0, 1]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements-result-server.txt
            requirements-budget-db.txt
      - name: Install encrypted database test dependencies
        run: |
          python -m pip install -r requirements-result-server.txt
          python -m pip install --report "$RUNNER_TEMP/sqlcipher-install.json" -r requirements-budget-db.txt
      - name: Record SQLCipher wheel and runtime versions
        run: python result_server/tests/report_sqlcipher_runtime.py "$RUNNER_TEMP/sqlcipher-install.json"
      - name: Require SQLCipher and run encrypted database tests
        run: |
          python -c 'from sqlcipher3 import dbapi2'
          python result_server/tests/run_encrypted_db_tests.py --shard ${{ matrix.shard }} -q -n 2 --dist loadfile --durations=10

  profile-data-shell-group:
    needs: test-scope
    if: needs.test-scope.outputs.full == 'true'
    name: profile-data-shell / ${{ matrix.shell-group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell-group:
          - common-observation
          - common-execution-run
          - common-execution-other
          - result-sender
          - estimation

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ${{ matrix.shell-group }} shell tests
        run: bash scripts/tests/run_profile_data_shell_tests.sh "${{ matrix.shell-group }}"

  profile-data-shell:
    runs-on: ubuntu-latest
    needs: [test-scope, profile-data-shell-group]
    if: ${{ always() }}

    steps:
      - name: Check shell test groups
        env:
          SCOPE_STATUS: ${{ needs.test-scope.result }}
          FULL_TESTS: ${{ needs.test-scope.outputs.full }}
          SHELL_STATUS: ${{ needs.profile-data-shell-group.result }}
        run: |
          set -euo pipefail
          if [ "$SCOPE_STATUS" != "success" ]; then
            echo "Test scope selection failed"
            exit 1
          fi
          if [ "$FULL_TESTS" = "false" ] && [ "$SHELL_STATUS" = "skipped" ]; then
            echo "Shell tests not applicable to this non-executable change"
            exit 0
          fi
          if [ "$FULL_TESTS" != "true" ] || [ "$SHELL_STATUS" != "success" ]; then
            echo "One or more shell test groups failed"
            exit 1
          fi
          echo "All shell test groups passed"
