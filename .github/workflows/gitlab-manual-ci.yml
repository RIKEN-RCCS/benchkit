name: GitLab Manual CI

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch, tag, or SHA in this repository to test"
        required: true
        default: "develop"
      gitlab_target:
        description: "GitLab target project"
        required: true
        type: choice
        options:
          - swc
          - gitlab_com
        default: swc
      result_server_target:
        description: "Result server target resolved by GitLab CI/CD variable scope"
        required: true
        type: choice
        options:
          - dev2
          - dev
        default: dev2
      code:
        description: "Benchkit code filter, for example: qws,genesis"
        required: false
      system:
        description: "System filter, for example: Fugaku,MiyabiG"
        required: false
      nodes:
        description: "Optional list.csv nodes filter, for example: 1"
        required: false
      numproc_node:
        description: "Optional list.csv numproc_node filter, for example: 4"
        required: false
      nthreads:
        description: "Optional list.csv nthreads filter, for example: 32"
        required: false
      activity:
        description: "Optional public activity/budget label recorded as BK_EXECUTION_ACTIVITY"
        required: false
      allocation_project_id:
        description: "Optional allocation/project ID passed as BK_ALLOCATION_PROJECT_ID"
        required: false
      app:
        description: "Benchpark app filter, for example: osu-micro-benchmarks"
        required: false
      benchpark:
        description: "Run the Benchpark path together with Benchkit"
        required: false
        type: boolean
        default: false
      park_only:
        description: "Run only the Benchpark path"
        required: false
        type: boolean
        default: false
      park_send:
        description: "Run the Benchpark send-only path"
        required: false
        type: boolean
        default: false

concurrency:
  group: gitlab-manual-ci-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gitlab-manual-ci:
    name: Run GitLab CI manually
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted workflow ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: trusted

      - name: Reject production main workflow branch
        env:
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "${WORKFLOW_REF_NAME}" = "main" ]; then
            echo "::error::GitLab Manual CI must be run from develop or a trusted non-production workflow branch."
            exit 1
          fi

      - name: Reject production main target
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail

          case "${TARGET_REF}" in
            main|heads/main|refs/heads/main|origin/main|refs/remotes/origin/main)
              echo "::error::GitLab Manual CI must not target the production main branch. Use develop, a trusted ci/pr-* branch, a feature branch, a tag, or a SHA for manual validation."
              exit 1
              ;;
          esac

      - name: Prepare SWC GitLab repository settings
        if: ${{ inputs.gitlab_target == 'swc' }}
        id: gitlab-repo-swc
        uses: ./trusted/.github/actions/prepare-gitlab-repo
        with:
          gitlab-repo: ${{ secrets.GITLAB_REPO }}

      - name: Prepare GitLab.com repository settings
        if: ${{ inputs.gitlab_target == 'gitlab_com' }}
        id: gitlab-repo-com
        uses: ./trusted/.github/actions/prepare-gitlab-repo
        with:
          gitlab-repo: gitlab.com/yoshifuminakamura/benchkit.git

      - name: Check out target ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_ref }}
          path: target

      - name: Push target ref to GitLab test branch
        working-directory: target
        env:
          GITLAB_TARGET: ${{ inputs.gitlab_target }}
          GITLAB_TOKEN_SWC: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_TOKEN_GITLAB_COM: ${{ secrets.GITLAB_COM_TOKEN }}
          GITLAB_REPO_HOST_PATH: ${{ steps.gitlab-repo-swc.outputs.host-path || steps.gitlab-repo-com.outputs.host-path }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          set -euo pipefail

          case "${GITLAB_TARGET}" in
            swc) GITLAB_TOKEN="${GITLAB_TOKEN_SWC}" ;;
            gitlab_com) GITLAB_TOKEN="${GITLAB_TOKEN_GITLAB_COM}" ;;
            *) echo "Unsupported GitLab target: ${GITLAB_TARGET}"; exit 1 ;;
          esac

          if [ -z "${GITLAB_TOKEN}" ] || [ -z "${GITLAB_REPO_HOST_PATH}" ]; then
            echo "Selected GitLab target token and repository settings are required."
            exit 1
          fi

          branch="github/manual-${GITHUB_RUN_ID}"
          echo "GITLAB_TEST_BRANCH=${branch}" >> "${GITHUB_ENV}"

          echo "Testing GitHub ref: ${TARGET_REF}"
          echo "Temporary GitLab branch: ${branch}"

          git config user.name "github-bot"
          git config user.email "bot@example.com"
          git remote add gitlab "https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO_HOST_PATH}"
          git push -o ci.skip gitlab "HEAD:refs/heads/${branch}" --force

      - name: Trigger and wait for GitLab pipeline
        env:
          GITLAB_TARGET: ${{ inputs.gitlab_target }}
          GITLAB_TOKEN_SWC: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_TOKEN_GITLAB_COM: ${{ secrets.GITLAB_COM_TOKEN }}
          GITLAB_HOST: ${{ steps.gitlab-repo-swc.outputs.host || steps.gitlab-repo-com.outputs.host }}
          GITLAB_PROJECT_PATH: ${{ steps.gitlab-repo-swc.outputs.project-path || steps.gitlab-repo-com.outputs.project-path }}
          CODE_FILTER: ${{ inputs.code }}
          SYSTEM_FILTER: ${{ inputs.system }}
          NODES_FILTER: ${{ inputs.nodes }}
          NUMPROC_NODE_FILTER: ${{ inputs.numproc_node }}
          NTHREADS_FILTER: ${{ inputs.nthreads }}
          RESULT_SERVER_TARGET: ${{ inputs.result_server_target }}
          ACTIVITY: ${{ inputs.activity }}
          ALLOCATION_PROJECT_ID: ${{ inputs.allocation_project_id }}
          BENCHPARK_APP: ${{ inputs.app }}
          BENCHPARK: ${{ inputs.benchpark }}
          PARK_ONLY: ${{ inputs.park_only }}
          PARK_SEND: ${{ inputs.park_send }}
        run: |
          set -euo pipefail

          case "${GITLAB_TARGET}" in
            swc) GITLAB_TOKEN="${GITLAB_TOKEN_SWC}" ;;
            gitlab_com) GITLAB_TOKEN="${GITLAB_TOKEN_GITLAB_COM}" ;;
            *) echo "Unsupported GitLab target: ${GITLAB_TARGET}"; exit 1 ;;
          esac
          if [ -z "${GITLAB_TOKEN}" ] || [ -z "${GITLAB_HOST}" ] || [ -z "${GITLAB_PROJECT_PATH}" ]; then
            echo "Selected GitLab target token and repository settings are required."
            exit 1
          fi

          project_encoded="$(PROJECT_PATH="${GITLAB_PROJECT_PATH}" python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["PROJECT_PATH"], safe=""))')"
          api="https://${GITLAB_HOST}/api/v4/projects/${project_encoded}/pipeline"
          if [ -n "${ALLOCATION_PROJECT_ID}" ]; then
            echo "::add-mask::${ALLOCATION_PROJECT_ID}"
          fi

          payload_file="$(mktemp)"
          PAYLOAD_FILE="${payload_file}" python3 - <<'PY'
          import json
          import os

          variables = []

          def add_variable(key, value, *, log_value=True):
              if value:
                  if log_value:
                      print(f"GitLab variable: {key}={value}")
                  else:
                      print(f"GitLab variable: {key}=(set)")
                  variables.append({
                      "key": key,
                      "value": value,
                      "variable_type": "env_var",
                  })

          add_variable("code", os.environ.get("CODE_FILTER", ""))
          add_variable("system", os.environ.get("SYSTEM_FILTER", ""))
          add_variable("nodes", os.environ.get("NODES_FILTER", ""))
          add_variable("numproc_node", os.environ.get("NUMPROC_NODE_FILTER", ""))
          add_variable("nthreads", os.environ.get("NTHREADS_FILTER", ""))
          result_server_target = os.environ.get("RESULT_SERVER_TARGET", "")
          if result_server_target == "dev":
              add_variable("BK_GITLAB_ENVIRONMENT", "develop")
          elif result_server_target == "dev2":
              print("GitLab result server target: dev2")
          elif result_server_target:
              raise SystemExit(f"Unsupported result_server_target: {result_server_target}")
          add_variable("BK_EXECUTION_ACTIVITY", os.environ.get("ACTIVITY", ""))
          add_variable("BK_ALLOCATION_PROJECT_ID", os.environ.get("ALLOCATION_PROJECT_ID", ""), log_value=False)
          add_variable("app", os.environ.get("BENCHPARK_APP", ""))

          if os.environ.get("BENCHPARK") == "true":
              add_variable("benchpark", "true")
          if os.environ.get("PARK_ONLY") == "true":
              add_variable("park_only", "true")
          if os.environ.get("PARK_SEND") == "true":
              add_variable("park_send", "true")

          with open(os.environ["PAYLOAD_FILE"], "w", encoding="utf-8") as f:
              json.dump({
                  "ref": os.environ["GITLAB_TEST_BRANCH"],
                  "variables": variables,
              }, f)
          PY

          response_file="$(mktemp)"
          http_status="$(curl --show-error --silent --output "${response_file}" --write-out "%{http_code}" --request POST --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" --header "Content-Type: application/json" --data @"${payload_file}" "${api}")"
          response="$(cat "${response_file}")"
          rm -f "${response_file}" "${payload_file}"

          if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
            echo "GitLab pipeline trigger failed with HTTP ${http_status}."
            echo "${response}"
            exit 1
          fi

          pipeline_id="$(PIPELINE="${response}" python3 -c 'import json, os; print(json.loads(os.environ["PIPELINE"])["id"])')"
          pipeline_url="$(PIPELINE="${response}" python3 -c 'import json, os; print(json.loads(os.environ["PIPELINE"]).get("web_url", ""))')"

          echo "GitLab pipeline: ${pipeline_url}"
          pipeline_api="https://${GITLAB_HOST}/api/v4/projects/${project_encoded}/pipelines/${pipeline_id}"

          for _ in $(seq 1 180); do
            response_file="$(mktemp)"
            http_status="$(curl --show-error --silent --output "${response_file}" --write-out "%{http_code}" --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" "${pipeline_api}")"
            response="$(cat "${response_file}")"
            rm -f "${response_file}"

            if [ "${http_status}" -lt 200 ] || [ "${http_status}" -ge 300 ]; then
              echo "GitLab pipeline status request failed with HTTP ${http_status}."
              echo "${response}"
              exit 1
            fi

            status="$(PIPELINE="${response}" python3 -c 'import json, os; print(json.loads(os.environ["PIPELINE"])["status"])')"

            echo "GitLab pipeline status: ${status}"
            case "${status}" in
              success)
                exit 0
                ;;
              failed|canceled|skipped)
                exit 1
                ;;
              manual)
                echo "GitLab pipeline is waiting for manual action."
                exit 1
                ;;
            esac

            sleep 20
          done

          echo "Timed out waiting for GitLab pipeline ${pipeline_id}."
          exit 1

      - name: Delete GitLab test branch
        if: always()
        working-directory: trusted
        env:
          GITLAB_TARGET: ${{ inputs.gitlab_target }}
          GITLAB_TOKEN_SWC: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_TOKEN_GITLAB_COM: ${{ secrets.GITLAB_COM_TOKEN }}
          GITLAB_REPO_HOST_PATH: ${{ steps.gitlab-repo-swc.outputs.host-path || steps.gitlab-repo-com.outputs.host-path }}
        run: |
          set -euo pipefail
          case "${GITLAB_TARGET}" in
            swc) GITLAB_TOKEN="${GITLAB_TOKEN_SWC}" ;;
            gitlab_com) GITLAB_TOKEN="${GITLAB_TOKEN_GITLAB_COM}" ;;
            *) GITLAB_TOKEN="" ;;
          esac
          if [ -n "${GITLAB_TEST_BRANCH:-}" ] && [ -n "${GITLAB_TOKEN:-}" ] && [ -n "${GITLAB_REPO_HOST_PATH:-}" ]; then
            git remote add gitlab-cleanup "https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO_HOST_PATH}" || true
            git push gitlab-cleanup --delete "${GITLAB_TEST_BRANCH}" || true
          fi
