name: Shellcheck

on:
  pull_request:
    paths:
      - "scripts/*.sh"
      - "scripts/**/*.sh"
      - "programs/**/*.sh"
      - "benchpark-bridge/scripts/*.sh"
      - "benchpark-bridge/scripts/**/*.sh"
      - ".github/workflows/shellcheck.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "scripts/*.sh"
      - "scripts/**/*.sh"
      - "programs/**/*.sh"
      - "benchpark-bridge/scripts/*.sh"
      - "benchpark-bridge/scripts/**/*.sh"
      - ".github/workflows/shellcheck.yml"
  workflow_dispatch:

jobs:
  shellcheck:
    name: shellcheck -S error
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install shellcheck-py
        run: |
          python -m pip install --quiet shellcheck-py
          shellcheck --version

      - name: Run bash syntax checks and shellcheck at error level
        shell: bash
        run: |
          set -euo pipefail
          file_list=$(mktemp)
          trap 'rm -f "$file_list"' EXIT
          find scripts/ programs/ benchpark-bridge/scripts/ -name "*.sh" -print0 | sort -z > "$file_list"
          mapfile -d '' -t files < "$file_list"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell files found; nothing to check."
            exit 0
          fi
          echo "Checking ${#files[@]} shell files with bash -n"
          for file in "${files[@]}"; do
            bash -n "$file"
          done
          echo "bash syntax: 0"
          echo "Checking ${#files[@]} shell files at -S error level"
          # Retain analysis of source dependencies when each input is checked separately.
          time printf '%s\0' "${files[@]}" | xargs -0 -r -n 1 -P 2 shellcheck -x -S error -f gcc
          echo "shellcheck error-level: 0"

      - name: Run warning-level shellcheck on changed app scripts
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          file_list=$(mktemp)
          trap 'rm -f "$file_list"' EXIT
          git diff --name-only -z --diff-filter=ACMRT "origin/${GITHUB_BASE_REF}...HEAD" -- ':(glob)programs/**/*.sh' |
            sort -z > "$file_list"
          mapfile -d '' -t files < "$file_list"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed app shell files found; warning-level shellcheck skipped."
            exit 0
          fi
          echo "Checking ${#files[@]} changed app shell files at -S warning level"
          # Retain analysis of source dependencies when each input is checked separately.
          time printf '%s\0' "${files[@]}" | xargs -0 -r -n 1 -P 2 shellcheck -x -S warning -f gcc
          echo "changed app shellcheck warning-level: 0"
