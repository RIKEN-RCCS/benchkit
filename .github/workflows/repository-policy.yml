name: Repository Policy

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check tracked text file integrity
        run: python3 scripts/tests/check_text_integrity.py
