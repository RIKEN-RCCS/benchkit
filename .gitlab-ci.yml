# Temporary artifact-only validation pipeline; application scripts are unchanged.
stages:
  - generate
  - trigger

generate_matrix:
  stage: generate
  tags: [camphor3_login]
  script:
    - bash scripts/matrix_generate.sh code=qws system=Camphor3 nodes=1 numproc_node=1 nthreads=112
    - awk '/^qws_Camphor3_N1_P1_T112_send_results:/ { exit } { print }' .gitlab-ci.generated.yml > .gitlab-ci.artifact-only.yml
    - grep -q '^qws_Camphor3_N1_P1_T112_run:' .gitlab-ci.artifact-only.yml
  artifacts:
    paths:
      - .gitlab-ci.artifact-only.yml
    expire_in: 1 week

trigger_child_pipeline:
  stage: trigger
  needs: [generate_matrix]
  trigger:
    include:
      - artifact: .gitlab-ci.artifact-only.yml
        job: generate_matrix
    strategy: depend
    forward:
      pipeline_variables: true
      yaml_variables: true
