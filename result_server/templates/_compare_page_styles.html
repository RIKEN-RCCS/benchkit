{% include "_chart_page_styles.html" %}
<style>
    .compare-note {
        margin: 0 0 16px;
        color: #52606d;
        font-size: 14px;
        line-height: 1.5;
    }
    .compare-warning {
        color: #c00;
        background: #fff3f3;
        padding: 8px 12px;
        border: 1px solid #fcc;
        border-radius: 4px;
    }
    .comparison-summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin: 12px 0 16px;
    }
    .comparison-kpi {
        border: 1px solid #d6e3e8;
        border-radius: 6px;
        padding: 10px 12px;
        background: #fff;
    }
    .comparison-kpi-label {
        display: block;
        color: #52606d;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
    }
    .comparison-kpi-value {
        display: block;
        margin-top: 4px;
        color: #1f2937;
        font-size: 20px;
        font-weight: 700;
    }
    .comparison-kpi-subline {
        display: block;
        margin-top: 3px;
        color: #52606d;
        font-size: 12px;
    }
    .comparison-diff-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
    }
    .comparison-diff-table th,
    .comparison-diff-table td {
        border: 1px solid #d6e3e8;
        padding: 8px 10px;
        text-align: left;
        vertical-align: top;
        overflow-wrap: anywhere;
    }
    .comparison-diff-table th {
        background: #eef6f7;
        color: #20384f;
    }
    .comparison-status {
        display: inline-block;
        min-width: 72px;
        border-radius: 999px;
        padding: 2px 8px;
        text-align: center;
        font-size: 12px;
        font-weight: 700;
    }
    .comparison-status-same {
        background: #e7f8ef;
        color: #17663a;
        border: 1px solid #bfe8cf;
    }
    .comparison-status-changed {
        background: #fff4df;
        color: #8a4b05;
        border: 1px solid #f1d197;
    }
</style>
