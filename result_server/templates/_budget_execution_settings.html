<fieldset class="budget-fieldset">
    <legend>{{ 'Common execution settings' if kind == 'budget_group' else 'Execution settings' }}</legend>
    <div class="budget-field budget-wide">
        <label for="budget-field-account_id">Saved GitLab / runner tag settings</label>
        <select id="budget-field-account_id" name="account_id" aria-describedby="budget-help-account_id">
            <option value="">New execution settings</option>
            {% for option in catalog.execution_accounts %}<option value="{{ option.id }}" data-system="{{ option.system }}" {% if selected.get('account_id') == option.id %}selected{% endif %}>{{ option.display_label }}</option>{% endfor %}
        </select>
        {{ field_help('account_id', 'Saved GitLab / runner tag settings') }}
    </div>
    <input type="hidden" name="loaded_account_id" value="{{ selected.get('account_id', '') }}">
    <div class="budget-field budget-wide">
        <label for="budget-field-connection_id">GitLab connection</label>
        <select id="budget-field-connection_id" name="connection_id" aria-describedby="budget-help-connection_id" required>
            <option value="">{{ 'Select' if catalog.connections else 'No GitLab connections' }}</option>
            {% for option in catalog.connections %}<option value="{{ option.id }}" {% if selected.get('connection_id') == option.id %}selected{% endif %} {% if not option.available %}disabled{% endif %}>{{ option.label }}{% if not option.available %} (Unavailable){% endif %}</option>{% endfor %}
        </select>
        {{ field_help('connection_id', 'GitLab connection') }}
    </div>
    <div class="budget-wide"><a href="{{ url_for('budget_registry.index', section='connections') }}">Manage connections</a></div>
    {% include "_budget_runner_fields.html" %}
</fieldset>
