<form method="POST" action="{{ url_for('budget_registry.review') }}" class="budget-form" data-budget-setup>
    {{ context('budget_setup', catalog.revision) }}
    <fieldset class="budget-fieldset">
        <legend>Budget</legend>
        {{ fields(specs.budget_setup[2][:8], selected, catalog, systems) }}
    </fieldset>
    {% include "_budget_execution_settings.html" %}
    <div class="budget-actions"><button type="submit" name="action" value="save">Save budget</button>{% if budget %}<a href="{{ url_for('budget_registry.index') }}">Cancel</a>{% endif %}</div>
</form>
<script type="application/json" id="budget-execution-data">{{ execution_choices | tojson }}</script>
<script type="application/json" id="budget-runner-data">{{ runner_choices | tojson }}</script>
