<form method="POST" action="{{ url_for('budget_registry.apply') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="ticket" value="{{ ticket }}">
    <label class="budget-confirm"><input type="checkbox" name="confirm_shared_change" required>Apply to the shared registry used by all connected Portals</label>
    <div class="budget-actions"><button type="submit">Apply change</button><a href="{{ back_url }}">Cancel</a></div>
</form>
