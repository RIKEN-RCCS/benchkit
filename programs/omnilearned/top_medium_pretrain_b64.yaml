# OmniLearned benchmark config, RC_DGXSP: the pretrain recipe of
# top_medium_pretrain.yaml at batch 64. GB10's 121 GB of unified memory
# cannot hold b128 in FP32, so local batch follows memory, as in the paper.
# run.sh substitutes the dataset path.
path: __OMNILEARNED_DATA__
size: medium
mode: pretrain
num_classes: 2
interaction: true
local_interaction: true
batch: 64
num_workers: 8
persistent_workers: true
check_remote: false
ema: false
epoch: 2
iterations: 250
val_iterations: 20
lr: 0.00003
wd: 0.5
save_tag: bench
wandb: false
