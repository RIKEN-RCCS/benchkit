# OmniLearned benchmark config: the paper's pretraining step
# (arXiv:2510.24066 Sec. III; the repo's configs/pretrain_small.yaml) on the
# portable `top` dataset. mode=pretrain joint loss (classification + flow
# matching), medium model, local batch 128 (global 4096 at 32 GPUs, the
# paper's operating point), lr 3e-5, persistent workers.
# run.sh substitutes the dataset path.
path: __OMNILEARNED_DATA__
size: medium
mode: pretrain
num_classes: 2
interaction: true
local_interaction: true
batch: 128
num_workers: 8
persistent_workers: true
check_remote: false
ema: false
epoch: 2
iterations: 250
val_iterations: 20
lr: 0.00003
wd: 0.5
save_tag: bench
wandb: false
